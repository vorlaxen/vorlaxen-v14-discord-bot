name: VorlaxenDiscordBot

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: vorlaxen_bot
    restart: unless-stopped
    env_file:
      - ./env/.env.development
    volumes:
      - .:/app
      - /app/node_modules
      - /app/dist
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: vorlaxen_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: vorlaxen_db
      POSTGRES_USER: vorlaxen_user
      POSTGRES_PASSWORD: pass123
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vorlaxen_user -d vorlaxen_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: vorlaxen_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --requirepass VFKuMdr5gH5Ypq
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "VFKuMdr5gH5Ypq", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data: